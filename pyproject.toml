[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "palimem"
version = "0.0.1"
description = "Justified memory for LLM agents: evidence-pinned beliefs, retraction that propagates, uncertainty kept rather than guessed. Pre-alpha."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christian Leiva Beltran" }]
keywords = ["llm", "agents", "memory", "belief-revision", "truth-maintenance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []   # core is standard library only

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
openai-compat = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/chleiva/palimem"
Study = "https://doi.org/10.5281/zenodo.23127764"

[tool.hatch.build.targets.wheel]
packages = ["src/palimem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
