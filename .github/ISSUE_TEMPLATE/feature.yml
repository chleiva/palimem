name: Feature request
description: A capability that is not in the design or the task tracker
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I read the non-goals in docs/DESIGN_v0.3.md (no weight updates, no episodic or procedural memory, no multi-tenant in v1)
          required: true
        - label: This does not change the `Report` or `Answer` contract (otherwise use the contract-change template)
          required: false
