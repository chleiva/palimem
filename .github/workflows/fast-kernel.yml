name: fast-kernel

# Gates for the CANDIDATE fast kernel (T-B10). The enumeration kernel stays the production kernel; these jobs
# are the differential evidence a promotion decision needs (docs/FAST_KERNEL.md). Not part of the main `ci`
# workflow: they run nightly, on demand, and on pull requests that touch the candidate or its harness.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"
  pull_request:
    paths:
      - "src/palimem/kernel/fast.py"
      - "harness/fast_kernel_diff.py"
      - "harness/fast_pipeline_diff.py"
      - "harness/budget_crosscheck.py"
      - "tests/test_fast_kernel.py"
      - "tests/test_fast_conformance.py"
      - ".github/workflows/fast-kernel.yml"

jobs:
  fast-kernel:
    runs-on: ubuntu-latest
    env:
      HARNESS_REQUIRED: "1"
      PALIMPSEST_STUDY_DIR: ${{ github.workspace }}/study
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: pin
        run: echo "commit=$(python3 -c "import json;print(json.load(open('harness/study_pin.json'))['commit'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: chleiva/palimpsest
          ref: ${{ steps.pin.outputs.commit }}
          path: study
      - uses: actions/cache@v4
        with:
          path: .cache/frozen
          key: frozen-setting1-686cf0bbf43f
      - run: pip install -e ".[dev]"
      - name: Fetch and verify the frozen set
        run: python -m harness.frozen verify --fetch
      - name: Fast kernel vs enumeration vs gold (strict, with provenance); every 5th stream on PR/manual, all on the nightly
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS=""; else ARGS="--stride 5"; fi
          python -m harness.fast_kernel_diff $ARGS --provenance --speed --out fast-kernel-diff.json
      - name: Self-test, the gate must fail on injected bugs
        run: |
          if python -m harness.fast_kernel_diff --limit 40 --inject-bug self-update; then
            echo "::error::fast_kernel_diff did not detect injected bug 'self-update'"; exit 1
          fi
      - name: Full pipeline with the fast kernel, strict provenance (every 25th stream; every 5th nightly)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then STRIDE=5; else STRIDE=25; fi
          python -m harness.fast_pipeline_diff --stride "$STRIDE" --backend memory --provenance strict
      - name: Differential tests and the conformance suite with the fast kernel
        run: pytest -q tests/test_fast_kernel.py tests/test_fast_conformance.py
      - name: Budget cross-check at 8-12 reports per key vs the global brute-force oracle (bounded; nightly larger)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then N=60; else N=12; fi
          python -m harness.budget_crosscheck --streams-per-shape "$N" --workers 2 --out budget-crosscheck.json
      - name: Budget cross-check self-test, a wrong semantics must be caught
        run: |
          if python -m harness.budget_crosscheck --streams-per-shape 4 --workers 2 --shapes selfupdate --inject-bug self-update; then
            echo "::error::budget_crosscheck did not detect the injected semantics"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-kernel-reports
          path: |
            fast-kernel-diff.json
            budget-crosscheck.json
