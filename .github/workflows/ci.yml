name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: full 500-stream differential run

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict src/palimem
      - run: python -m palimem.schemas --check   # committed schemas/ must match the types
      - run: pytest -q          # harness tests skip here: no study checkout (see the harness job)
      - name: Conformance summary (ReferenceStub until an implementation exists)
        run: python -m tests.conformance.runner
      - run: ./scripts/check_secrets.sh --all

  # Differential gate (T-E1) + frozen-set guard (T-E2): the incremental store must agree with symbolic
  # replay and the frozen oracle gold on every query. Runtime on a laptop: ~27 s for all 500 streams
  # (30,272 queries); the PR/push run uses every 5th stream.
  harness:
    runs-on: ubuntu-latest
    env:
      HARNESS_REQUIRED: "1"
      PALIMPSEST_STUDY_DIR: ${{ github.workspace }}/study
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - id: pin
        run: echo "commit=$(python3 -c "import json;print(json.load(open('harness/study_pin.json'))['commit'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: chleiva/palimpsest
          ref: ${{ steps.pin.outputs.commit }}
          path: study
      - uses: actions/cache@v4
        with:
          path: .cache/frozen
          key: frozen-setting1-686cf0bbf43f   # first 12 hex of the pinned Zenodo zip SHA-256
      - run: pip install -e ".[dev]"
      - name: Fetch and verify the frozen set (all 1,501 files against the pinned manifest)
        run: python -m harness.frozen verify --fetch
      - name: Differential run, bounded (every 5th stream) on push/PR, full on the nightly schedule
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS=""; else ARGS="--stride 5"; fi
          python -m harness.differential $ARGS --out differential-report.json
      - name: Self-test, the gate must fail on injected bugs
        run: |
          for bug in drop-propagation mutate-answer; do
            if python -m harness.differential --limit 25 --inject-bug "$bug"; then
              echo "::error::harness did not detect injected bug '$bug'"; exit 1
            fi
          done
      - name: Kernel differential (T-B1), bounded (every 5th stream) on push/PR, full on the nightly schedule
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS=""; else ARGS="--stride 5"; fi
          # representation of source retraction that the contract can express (per-report withdraws):
          # known gap only, 0 unexplained disagreements
          python -m harness.kernel_diff $ARGS --out kernel-diff-report.json
          # the paper's exact source-level retraction: strict, 0 disagreements
          python -m harness.kernel_diff $ARGS --source-retract sidetable --strict
      - name: Provenance parity (T-B4, S-12), strict - the kernel's profile provenance must equal the study's oracle set
        run: |
          python -m harness.kernel_diff $ARGS --source-retract sidetable --provenance strict --strict --out kernel-provenance-report.json
      - name: Kernel self-test, the gate must fail on injected bugs
        run: |
          for bug in self-update ignore-corrections mutate-answer; do
            if python -m harness.kernel_diff --limit 100 --inject-bug "$bug"; then
              echo "::error::kernel_diff did not detect injected bug '$bug'"; exit 1
            fi
          done
          if python -m harness.kernel_diff --limit 100 --source-retract sidetable --provenance strict --strict --inject-bug drop-provenance; then
            echo "::error::kernel_diff --provenance strict did not detect injected bug 'drop-provenance'"; exit 1
          fi
      - run: pytest -q tests/test_frozen_guard.py tests/test_differential.py tests/test_kernel_diff.py tests/test_kernel_oracle_property.py tests/test_convert.py tests/test_provenance_oracle.py tests/conformance/test_runner.py::test_compat_authority_check_runs_or_skips
      - name: Pipeline differential (the FULL pipeline through Memory, both backends), bounded on push/PR, full on the nightly schedule
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS=""; else ARGS="--stride 10"; fi
          python -m harness.pipeline_diff $ARGS --backend both --out pipeline-diff-report.json
      - name: Pipeline self-test, the gate must fail on injected bugs
        run: |
          for bug in mutate-answer no-source-retraction self-update; do
            if python -m harness.pipeline_diff --limit 25 --backend memory --inject-bug "$bug"; then
              echo "::error::pipeline_diff did not detect injected bug '$bug'"; exit 1
            fi
          done
      - run: pytest -q tests/test_pipeline_diff.py tests/test_pipeline.py tests/test_compat_adapter.py tests/conformance/test_impl_memory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-report
          path: |
            differential-report.json
            kernel-diff-report.json
            kernel-provenance-report.json
            pipeline-diff-report.json
